<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Arc Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="calculator__header">
      <span class="brand"><span class="brand__dot"></span>Arc</span>
      <button class="history-toggle" type="button" aria-expanded="false" aria-controls="history" title="Toggle calculation history">History</button>
    </header>
    <section class="screen" aria-live="polite" aria-atomic="true">
      <p class="expression" id="expression">&nbsp;</p>
      <output class="display" id="display">0</output>
    </section>
    <aside class="history" id="history" hidden>
      <div class="history__top"><span>Recent calculations</span><button type="button" class="clear-history">Clear</button></div>
      <ul class="history__list"></ul>
    </aside>
    <div class="keypad" aria-label="Calculator keypad">
      <button class="key key--utility" data-action="clear">AC</button>
      <button class="key key--utility" data-action="sign">+/−</button>
      <button class="key key--utility" data-action="percent">%</button>
      <button class="key key--operator" data-value="÷">÷</button>
      <button class="key" data-value="7">7</button><button class="key" data-value="8">8</button><button class="key" data-value="9">9</button><button class="key key--operator" data-value="×">×</button>
      <button class="key" data-value="4">4</button><button class="key" data-value="5">5</button><button class="key" data-value="6">6</button><button class="key key--operator" data-value="−">−</button>
      <button class="key" data-value="1">1</button><button class="key" data-value="2">2</button><button class="key" data-value="3">3</button><button class="key key--operator" data-value="+">+</button>
      <button class="key key--zero" data-value="0">0</button><button class="key" data-value=".">.</button><button class="key key--equals" data-action="equals">=</button>
    </div>
    <p class="hint">Press <kbd>Enter</kbd> to calculate · <kbd>Esc</kbd> to clear</p>
  </main>
  <script src="scripts.js"></script>
</body>
</html>
